<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Financiera</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #eef2f7;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: #ffffff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

table {
  width: 100%;
  border-collapse: collapse;
}

td {
  border: 1px solid #dcdcdc;
  padding: 12px;
  text-align: center;
  font-size: 17px;
}

/* COLORES PROFESIONALES */
.header { background: #1f3c88; color: white; font-weight: bold; }
.gray { background: #f1f3f6; }
.red { background: #fdecea; color: #b71c1c; font-weight: bold; }
.green { background: #e8f5e9; color: #1b5e20; font-weight: bold; }

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 6px;
}

/* BOTÓN PRINCIPAL */
.btn-calcular {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #1f3c88;
  color: white;
  border: none;
  font-size: 18px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

.btn-calcular:hover {
  background: #162d66;
}

/* BOTÓN SECUNDARIO */
.btn-toggle {
  width: auto;
  padding: 6px 12px;
  margin-top: 8px;
  background: #ccc;
  color: #333;
  border: none;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
  float: right;
}

.btn-toggle:hover {
  background: #bbb;
}

</style>
</head>

<body>

<div class="container">

<table>
<tr class="header"><td colspan="4">CALCULADORA FINANCIERA</td></tr>

<tr>
<td>Precio Total</td>
<td colspan="3"><input type="number" id="precio"></td>
</tr>

<tr>
<td>Depósito</td>
<td colspan="3"><input type="number" id="deposito"></td>
</tr>

<tr>
<td>Cuotas</td>
<td colspan="3"><input type="number" id="cuotas"></td>
</tr>

<tr class="gray">
<td>Precio Compra</td>
<td id="compra">-</td>
<td>IGV</td>
<td id="igv">-</td>
</tr>

<tr class="red">
<td>Saldo a Financiar</td>
<td colspan="3" id="saldo">-</td>
</tr>
</table>

<button class="btn-calcular" onclick="calcular()">CALCULAR</button>
<button class="btn-toggle" onclick="toggle()">mostrar %</button>

<br><br>

<table id="resultado"></table>

</div>

<script>
let verPorcentaje = false;

function toggle(){
  verPorcentaje = !verPorcentaje;
  calcular();
}

function calcular(){

let precio = parseFloat(document.getElementById("precio").value);
let deposito = parseFloat(document.getElementById("deposito").value);
let cuotas = parseInt(document.getElementById("cuotas").value);

if(isNaN(precio) || isNaN(deposito) || isNaN(cuotas)){
  alert("Completa los datos");
  return;
}

let precioCompra = precio / 1.18;
let igv = precio - precioCompra;
let saldo = precio - deposito;

document.getElementById("compra").innerText = "S/. " + precioCompra.toFixed(2);
document.getElementById("igv").innerText = "S/. " + igv.toFixed(2);
document.getElementById("saldo").innerText = "S/. " + saldo.toFixed(2);

const factores = {
  2:0.5298,3:0.36,4:0.2751,5:0.2243,6:0.1904,
  7:0.1663,8:0.1482,9:0.1342,10:0.123,
  11:0.1138,12:0.1062,13:0.0998,14:0.0943,
  15:0.0896,16:0.0855,17:0.0818,18:0.0786,19:0.0758
};

let factor = factores[cuotas];
if(!factor){
  alert("Cuotas entre 2 y 19");
  return;
}

let monto = saldo * factor;
let porcentaje = (factor * 100).toFixed(2) + "%";

let tabla = document.getElementById("resultado");

tabla.innerHTML = `
<tr class="header">
<td>CUOTAS</td>
<td>MONTO</td>
${verPorcentaje ? "<td>%</td>" : ""}
</tr>

<tr class="green">
<td>${cuotas}</td>
<td>S/. ${monto.toFixed(2)}</td>
${verPorcentaje ? `<td>${porcentaje}</td>` : ""}
</tr>
`;
}
</script>

</body>
</html>
