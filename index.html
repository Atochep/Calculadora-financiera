<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Financiamiento</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contenedor {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 700px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header img {
      height: 60px;
      margin-right: 15px;
    }

    .header h2 {
      margin: 0;
      font-size: 26px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004494;
    }

    .resultados {
      margin-top: 25px;
    }

    .resultado {
      background-color: #f0f4f8;
      padding: 15px;
      border-radius: 10px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .resultado .titulo {
      font-weight: 600;
      color: #333;
    }

    .resultado .valor {
      font-weight: bold;
      color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="header">
      <img src="imagenes/logo.png" alt="Logo">
      <h2>Calculadora de Financiamiento</h2>
    </div>

    <label for="precioTotal">Precio Total (en soles):</label>
    <input type="number" id="precioTotal" placeholder="Ej: 2500">

    <label for="deposito">Depósito Pagado Hoy (en soles):</label>
    <input type="number" id="deposito" placeholder="Ej: 500">

    <label for="cuotas">Número de Cuotas Mensuales:</label>
    <input type="number" id="cuotas" placeholder="Ej: 6">

    <button onclick="calcularFinanciamiento()">Calcular</button>

    <div class="resultados">
      <div class="resultado">
        <p class="titulo">Precio de Compra:</p>
        <p class="valor" id="resultadoCompra">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">IGV:</p>
        <p class="valor" id="resultadoIGV">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Saldo a Financiar:</p>
        <p class="valor" id="resultadoSaldo">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Pago Mínimo Mensual con Intereses:</p>
        <p class="valor" id="resultadoPagoInteres">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Pago Mensual sin Intereses:</p>
        <p class="valor" id="resultadoPagoSinInteres">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Interés Mensual:</p>
        <p class="valor" id="resultadoInteresMensual">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Interés Diario:</p>
        <p class="valor" id="resultadoInteresDiario">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Total de Intereses:</p>
        <p class="valor" id="resultadoTotalInteres">-</p>
      </div>
      <div class="resultado">
        <p class="titulo">Total a Pagar:</p>
        <p class="valor" id="resultadoTotalPagar">-</p>
      </div>
    </div>
  </div>

  <script>
    function calcularFinanciamiento() {
      let precioTotal = parseFloat(document.getElementById('precioTotal').value);
      let deposito = parseFloat(document.getElementById('deposito').value);
      let cuotas = parseInt(document.getElementById('cuotas').value);

      if (isNaN(precioTotal) || isNaN(deposito) || isNaN(cuotas) || cuotas <= 0) {
        alert("Por favor, ingresa valores válidos.");
        return;
      }

      let precioCompra = precioTotal / 1.18;
      let igv = precioTotal - precioCompra;
      let saldoFinanciar = precioTotal - deposito;

      const factores = {
        2: 0.5298, 3: 0.36, 4: 0.2751, 5: 0.2243, 6: 0.1904,
        7: 0.1663, 8: 0.1482, 9: 0.1342, 10: 0.123, 11: 0.1138,
        12: 0.1062, 13: 0.0998, 14: 0.0943, 15: 0.0896, 16: 0.0855,
        17: 0.0818, 18: 0.0786, 19: 0.0758
      };

      let pagoMensualSinInteres = saldoFinanciar / cuotas;
      let factorInteres = factores[cuotas] || 0;
      let pagoMinimoMensual = cuotas <= 6 ? 0 : saldoFinanciar * factorInteres;
      let totalInteres = cuotas <= 6 ? 0 : (pagoMinimoMensual * cuotas - saldoFinanciar);
      let interesMensual = cuotas <= 6 ? 0 : totalInteres / cuotas;

      const fechaActual = new Date();
      const diasDelMes = new Date(fechaActual.getFullYear(), fechaActual.getMonth() + 1, 0).getDate();
      let interesDiario = interesMensual / diasDelMes;
      let totalPagar = cuotas <= 6 ? saldoFinanciar : saldoFinanciar + totalInteres;

      document.getElementById('resultadoCompra').innerText = `${precioCompra.toFixed(2)} soles`;
      document.getElementById('resultadoIGV').innerText = `${igv.toFixed(2)} soles`;
      document.getElementById('resultadoSaldo').innerText = `${saldoFinanciar.toFixed(2)} soles`;
      document.getElementById('resultadoPagoInteres').innerText = cuotas <= 6 ? "No aplica" : `${pagoMinimoMensual.toFixed(2)} soles`;
      document.getElementById('resultadoPagoSinInteres').innerText = `${pagoMensualSinInteres.toFixed(2)} soles`;
      document.getElementById('resultadoInteresMensual').innerText = cuotas <= 6 ? "0.00 soles" : `${interesMensual.toFixed(2)} soles`;
      document.getElementById('resultadoInteresDiario').innerText = cuotas <= 6 ? "0.00 soles" : `${interesDiario.toFixed(2)} soles`;
      document.getElementById('resultadoTotalInteres').innerText = cuotas <= 6 ? "0.00 soles" : `${totalInteres.toFixed(2)} soles`;
      document.getElementById('resultadoTotalPagar').innerText = `${totalPagar.toFixed(2)} soles`;
    }
  </script>
</body>
</html>
